    <!-- Performance: preconnect, async font, preload Supabase API -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://wnowaafqtjoycjhmxsnf.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://wnowaafqtjoycjhmxsnf.supabase.co">
    <!-- Fonte única do projeto: Nunito (todos os pesos usados) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"></noscript>
    <!-- iOS safe area + tap optimization -->
    <style>
      html, body { overscroll-behavior-y: none; -webkit-overflow-scrolling: touch; }
      img { content-visibility: auto; }
      /* Esconde badge “Edit with Lovable” (injetado no publish) */
      #lovable-badge,
      a#lovable-badge,
      [id="lovable-badge"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      // Remove o badge se a Lovable re-injetar depois do load
      (function () {
        function killBadge() {
          try {
            document.querySelectorAll('#lovable-badge, a#lovable-badge, [id="lovable-badge"]').forEach(function (el) {
              el.remove();
            });
          } catch (_) {}
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", killBadge);
        } else {
          killBadge();
        }
        // Observer leve: só enquanto o badge puder aparecer
        try {
          var obs = new MutationObserver(function () {
            killBadge();
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
          setTimeout(function () { try { obs.disconnect(); } catch (_) {} }, 15000);
        } catch (_) {}
      })();
    </script>
    <!-- PWA -->

    <!-- Structured data: Organization + WebSite + SoftwareApplication -->

          "url": "https://kidzz.app",

        },
        {

          "name": "Kidzz",
          "url": "https://kidzz.app",
          "inLanguage": "pt-BR",
          "potentialAction": {
            "@type": "SearchAction",

  <body>
    <script>
      // /lp boot hint: paint LP background instantly to kill white flash before React mounts.
      try {
        if (location.pathname === "/lp") {
          document.documentElement.style.background = "#F7F6F2";
          document.documentElement.classList.add("lp-route");
          var s = document.createElement("style");
          s.textContent = "body{background:#F7F6F2}#root:empty::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 22%,#FBFAF6 0%,#F7F6F2 62%);}";
          document.head.appendChild(s);
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
